# Q: Is Transformer capacity the bottleneck?
#
# Two self-attention layers instead of one. neck.channels is left at 64 on
# purpose: widening the neck would mostly grow the CNN side (P2 alone goes from
# ~0.66G to ~1.30G MACs at 96 channels), so this is the cheap, clean way to add
# Transformer capacity. Adds ~34K params, all in the token path.
_base_: [../models/model_main.yaml]
model:
  token:
    mixer_layers: 2
