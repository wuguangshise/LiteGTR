# Q: Do the finer levels need to contribute tokens?
#
# All 56 tokens drawn from P5 only (grid 2 -> 14 per cell). Write-back still goes
# to P3/P4/P5, so only the SOURCE of the tokens changes. P5 carries scene-level
# semantics but has lost most small-object detail at stride 32.
_base_: [../models/model_main.yaml]
model:
  token:
    levels: [P5]
    budget: {P5: 56}
    writeback_levels: [P3, P4, P5]
