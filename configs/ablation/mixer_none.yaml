# Q: Does token-to-token interaction matter, or is select + write-back enough?
#
# Removes the Token Mixer's self-attention entirely (0 layers). Tokens are still
# selected and still written back geometrically -- they just never exchange
# information with each other first. This is the ablation that tests the
# "global relation modelling" claim specifically: if it barely moves, the gain
# comes from routing and writeback, not from the Transformer.
_base_: [../models/model_main.yaml]
model:
  token:
    mixer_layers: 0
