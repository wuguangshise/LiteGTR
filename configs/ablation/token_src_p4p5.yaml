# Q: Is P3 worth including as a token source?
#
# 56 tokens from P4 (48) + P5 (8); P3 contributes none. Write-back unchanged.
# Sits between token_src_p5 and the main model (P3+P4+P5).
_base_: [../models/model_main.yaml]
model:
  token:
    levels: [P4, P5]
    budget: {P4: 48, P5: 8}
    writeback_levels: [P3, P4, P5]
