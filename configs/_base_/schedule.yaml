train:
  epochs: 200             # from scratch (P1-6). Changing this? Rescale the four values marked (*)
  batch_size: 16
  val_batch_size: 16
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 3
  # FlatCosine (DEIM, CVPR 2025): hold the peak LR for about half the run, then
  # cosine-decay. Helps most when training from scratch.
  scheduler: flat_cosine    # flat_cosine | cosine
  flat_epochs: 100         # (*) half of epochs, the DEIM ratio
  final_lr_ratio: 0.01      # decay floor; DEIM's 0.5 is for a ~58-epoch fine-tune
  # Mosaic off for the final epochs (YOLO close_mosaic=10, DEIM no_aug_epoch=8)
  no_aug_epochs: 10        # (*) ~5% of epochs, at least 10
  amp: true
  grad_clip: 10.0
  val_interval: 5           # validation cannot change the weights, only best.pt granularity
  val_dense_last: 20        # (*) every epoch over the final ~10%, where the best epoch lands
  save_period: 0          # >0 also writes epoch_xx.pt
  monitor: mAP50_95
  model_ema:              # weight EMA; distinct from the token-routing teacher
    enabled: true
    decay: 0.9999         # D-FINE (ICLR 2025) and Ultralytics YOLO both use 0.9999
    tau: 2000

loss:
  qfl_weight: 1.0
  giou_weight: 2.0
  dfl_weight: 0.25
  token_weight: 0.5       # EMA routing consistency
  token_temperature: 1.0
  token_hard_ratio: 1.0   # <1.0 keeps only the hardest positions

# Post-processing for every evaluation (training-time val, tools/val.py, test.py, submit).
# Defaults follow the protocol of the detectors we compare with -- RemDet (mmyolo) and
# Ultralytics YOLO val: score 0.001, class-wise NMS at IoU 0.7, multi-label, 300 boxes.
# This is an mAP protocol (maximise recall); it is NOT for drawing -- figures filter at
# score >= 0.25 like every detector's predict mode, so a drawing from these boxes is busy.
# Never needs retraining: tools/diagnose_predictions.py compares variants on a checkpoint.
test:
  score_thr: 0.001
  nms_iou: 0.7
  max_det: 300
  multi_label: true       # a location may output several classes (pedestrian AND people)
  agnostic: false         # true: one NMS across classes
  containment: null       # e.g. 0.8: drop a box >= 80% covered by a higher-scoring one

assigner:
  topk: 13
  alpha: 1.0
  beta: 6.0
  # STAL (Ultralytics YOLO26): for candidate selection a GT side shorter than this many
  # pixels is widened to it, so a box narrower than the P2 stride still has candidates.
  # Ultralytics uses stride[1] -- 8 px for a P2-P5 head. 0 = plain inside-the-box rule,
  # under which ~10% of VisDrone boxes at 640 input are never positives.
  stal_size: 8
