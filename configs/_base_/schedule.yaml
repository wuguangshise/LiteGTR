train:
  epochs: 300             # from-scratch training needs a long schedule (P1-6)
  batch_size: 16
  val_batch_size: 16
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 3
  final_lr_ratio: 0.01
  amp: true
  grad_clip: 10.0
  val_interval: 1
  save_period: 0          # >0 also writes epoch_xx.pt
  monitor: mAP50_95
  model_ema:              # weight EMA; distinct from the token-routing teacher
    enabled: true
    decay: 0.9998
    tau: 2000

loss:
  qfl_weight: 1.0
  giou_weight: 2.0
  dfl_weight: 0.25
  token_weight: 0.5       # EMA routing consistency
  token_temperature: 1.0
  token_hard_ratio: 1.0   # <1.0 keeps only the hardest positions

assigner:
  topk: 13
  alpha: 1.0
  beta: 6.0
