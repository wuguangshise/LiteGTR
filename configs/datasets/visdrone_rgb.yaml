data:
  name: visdrone
  root: D:/dataset/VisDrone/LiteGTR   # your path; tools also accept --data-root to override
  train_split: VisDrone2019-DET-train
  val_split: VisDrone2019-DET-val
  test_split: VisDrone2019-DET-test-dev
  img_size: 640
  mosaic_prob: 0.5
  ignore_mode: mask       # training: class 0 regions are painted out, class 11 dropped
  eval_ignore_mode: drop  # evaluation: image untouched, class 0/11 annotations dropped --
                          # the COCO-json protocol of RemDet / mmdet VisDrone results
