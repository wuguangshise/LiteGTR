name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Budget guard + static-graph guard + shape tests
        run: pytest tests/ -q
      - name: Report the real parameter/MAC budget
        run: |
          python tools/profile_model.py --search
          python tools/profile_model.py --config configs/models/model_main.yaml
          python tools/profile_model.py --config configs/models/model_edge_s.yaml
